<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মানি ইনকাম</title>

<script src="//libtl.com/sdk.js"
data-zone="10832265"
data-sdk="show_10832265"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.container{
max-width:500px;
margin:auto;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:15px;
}

.balance{
font-size:35px;
font-weight:bold;
margin-top:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.orange{
background:#ff9800;
color:#fff;
}

.green{
background:#22c55e;
color:#fff;
}

.red{
background:#ef4444;
color:#fff;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
}
</style>
</head>
<body>

<div class="container">

<div class="card">
<h2>মানি ইনকাম</h2>
<p>বর্তমান ব্যালেন্স</p>

<div class="balance">
৳ <span id="balance">0.00</span>
</div>
</div>

<div class="card">
<h3>টাস্ক</h3>

<button class="orange" onclick="rewardAd()">
Reward Ad দেখুন
</button>

<button class="orange" onclick="popupAd()">
Popup Ad দেখুন
</button>
</div>

<div class="card">
<h3>Withdraw</h3>

<input type="number" id="amount" placeholder="টাকার পরিমাণ">

<button class="red" onclick="withdrawMoney()">
Withdraw Request
</button>
</div>

</div>

<script>

let balance =
parseFloat(localStorage.getItem("balance") || 0);

updateBalance();

function updateBalance(){
document.getElementById("balance").innerText =
balance.toFixed(2);

localStorage.setItem("balance", balance);
}

async function rewardAd(){

try{

if(typeof show_10832265 !== "function"){
alert("SDK Ready হয়নি");
return;
}

await show_10832265();

balance += 0.15;

updateBalance();

alert("০.১৫৳ যোগ হয়েছে");

}catch(e){

alert("Ad পাওয়া যায়নি");

}

}

async function popupAd(){

try{

if(typeof show_10832265 !== "function"){
alert("SDK Ready হয়নি");
return;
}

await show_10832265('pop');

balance += 0.15;

updateBalance();

alert("০.১৫৳ যোগ হয়েছে");

}catch(e){

alert("Popup Ad পাওয়া যায়নি");

}

}

function withdrawMoney(){

let amount =
parseFloat(document.getElementById("amount").value);

if(!amount){
alert("পরিমাণ লিখুন");
return;
}

if(amount < 50){
alert("মিনিমাম ৫০৳");
return;
}

if(amount > balance){
alert("পর্যাপ্ত ব্যালেন্স নেই");
return;
}

balance -= amount;

updateBalance();

alert("Withdraw Request Submitted");

}

</script>

</body>
</html>
